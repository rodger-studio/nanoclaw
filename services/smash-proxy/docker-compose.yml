# Read-only window for NanoClaw agents on Smash. See README.md.
#
# Host network so it can bind the docker0 bridge IP only (172.17.0.1): agent
# containers reach it via host.docker.internal, the internet cannot (ufw only
# opens the port on docker0). Secrets are a read-only file mount kept OUTSIDE
# the NanoClaw project root (which the main agent can read), and never env
# vars (visible in `docker inspect`).
services:
  smash-proxy:
    build: .
    image: smash-proxy:latest
    container_name: smash-proxy
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    environment:
      - BIND_HOST=172.17.0.1
      - PORT=3003
      - SECRETS_FILE=/run/secrets/smash-proxy.env
    volumes:
      - ${SMASH_PROXY_SECRETS:-${HOME}/.config/smash-proxy/smash-proxy.env}:/run/secrets/smash-proxy.env:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
